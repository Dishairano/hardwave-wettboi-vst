name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: cargo xtask bundle hardwave-wettboi --release

      - name: Package
        run: |
          cd target/bundled
          zip -r hardwave-wettboi-linux-x64.zip hardwave-wettboi.vst3 hardwave-wettboi.clap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hardwave-wettboi-linux-x64
          path: target/bundled/hardwave-wettboi-linux-x64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo xtask bundle hardwave-wettboi --release

      - name: Package
        shell: bash
        run: |
          cd target/bundled
          7z a -tzip hardwave-wettboi-windows-x64.zip hardwave-wettboi.vst3 hardwave-wettboi.clap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hardwave-wettboi-windows-x64
          path: target/bundled/hardwave-wettboi-windows-x64.zip

  build-macos-x64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build
        run: cargo xtask bundle hardwave-wettboi --release --target x86_64-apple-darwin

      - name: Package
        run: |
          cd target/bundled
          zip -r hardwave-wettboi-macos-x64.zip hardwave-wettboi.vst3 hardwave-wettboi.clap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hardwave-wettboi-macos-x64
          path: target/bundled/hardwave-wettboi-macos-x64.zip

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo xtask bundle hardwave-wettboi --release --target aarch64-apple-darwin

      - name: Package
        run: |
          cd target/bundled
          zip -r hardwave-wettboi-macos-arm64.zip hardwave-wettboi.vst3 hardwave-wettboi.clap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hardwave-wettboi-macos-arm64
          path: target/bundled/hardwave-wettboi-macos-arm64.zip

  release:
    needs: [build-linux, build-windows, build-macos-x64, build-macos-arm64]
    # macOS, not ubuntu: this job now runs lipo and codesign to build the
    # universal bundle, and neither exists on a Linux runner.
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create universal macOS zip
        run: |
          set -euo pipefail
          # This step used to unzip both slices and then copy the arm64 one,
          # producing a file named "universal" that held a thin arm64 binary.
          # Every Intel Mac silently failed to load the plug-in: hosts report
          # it only as "failed to scan", with no hint that the architecture is
          # wrong. lipo actually merges them.
          cd artifacts/hardwave-wettboi-macos-arm64 && unzip -o -q hardwave-wettboi-macos-arm64.zip && cd ../..
          cd artifacts/hardwave-wettboi-macos-x64   && unzip -o -q hardwave-wettboi-macos-x64.zip   && cd ../..

          rm -rf universal-macos && mkdir -p universal-macos
          # Start from the x64 bundle, then fold the arm64 binary into it.
          cp -R artifacts/hardwave-wettboi-macos-x64/hardwave-wettboi.vst3 universal-macos/
          cp -R artifacts/hardwave-wettboi-macos-x64/hardwave-wettboi.clap universal-macos/

          for B in vst3 clap; do
            lipo -create \
              artifacts/hardwave-wettboi-macos-x64/hardwave-wettboi.$B/Contents/MacOS/hardwave-wettboi \
              artifacts/hardwave-wettboi-macos-arm64/hardwave-wettboi.$B/Contents/MacOS/hardwave-wettboi \
              -output universal-macos/hardwave-wettboi.$B/Contents/MacOS/hardwave-wettboi
            # Ad-hoc sign after merging: lipo rewrites the binary and invalidates
            # any signature, and macOS will not load unsigned code into a host.
            codesign --force --deep --sign - universal-macos/hardwave-wettboi.$B
          done

          # Fail loudly rather than shipping a thin binary called universal again.
          for B in vst3 clap; do
            A=$(lipo -archs universal-macos/hardwave-wettboi.$B/Contents/MacOS/hardwave-wettboi)
            echo "hardwave-wettboi.$B -> $A"
            case "$A" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "::error::hardwave-wettboi.$B is not universal ($A)"; exit 1 ;;
            esac
          done

          cd universal-macos
          zip -r -q hardwave-wettboi-macos-universal.zip hardwave-wettboi.vst3 hardwave-wettboi.clap

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Hardwave WettBoi ${{ steps.version.outputs.version }}
          draft: false
          # Clean tags publish as stable Latest; -rc/-beta stay pre-release.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/hardwave-wettboi-linux-x64/*.zip
            artifacts/hardwave-wettboi-windows-x64/*.zip
            universal-macos/hardwave-wettboi-macos-universal.zip
          body: |
            ## Hardwave WettBoi ${{ steps.version.outputs.version }}

            Sidechain reverb & delay VST3/CLAP plugin — powered by Hardwave Studios.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Windows x64 | `hardwave-wettboi-windows-x64.zip` |
            | Linux x64 | `hardwave-wettboi-linux-x64.zip` |
            | macOS Universal (Intel + Apple Silicon) | `hardwave-wettboi-macos-universal.zip` |

            ### Installation

            **Windows:**
            1. Extract the zip
            2. Copy `hardwave-wettboi.vst3` folder to `C:\Program Files\Common Files\VST3\`
            3. Copy `hardwave-wettboi.clap` to `C:\Program Files\Common Files\CLAP\`

            **macOS:**
            1. Extract: `unzip hardwave-wettboi-macos-universal.zip`
            2. Copy `hardwave-wettboi.vst3` to `~/Library/Audio/Plug-Ins/VST3/`
            3. Copy `hardwave-wettboi.clap` to `~/Library/Audio/Plug-Ins/CLAP/`

            **Linux:**
            1. Extract: `unzip hardwave-wettboi-linux-x64.zip`
            2. Copy to `~/.vst3/` and `~/.clap/`

      - name: Update product database
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${VERSION#v}"

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 46.225.219.184 >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@46.225.219.184"

          BASE="https://github.com/Dishairano/hardwave-wettboi-vst/releases/download/${VERSION}"
          # The database password stays on the server: read it from the site's env there.
          SQL="
            UPDATE products SET
              current_version = '${VERSION_NUM}',
              download_url_windows = '${BASE}/hardwave-wettboi-windows-x64.zip',
              download_url_mac     = '${BASE}/hardwave-wettboi-macos-universal.zip',
              download_url_linux   = '${BASE}/hardwave-wettboi-linux-x64.zip'
            WHERE slug = 'wettboi';
            INSERT INTO plugin_versions (slug, version) VALUES ('wettboi', '${VERSION}')
              ON DUPLICATE KEY UPDATE version = '${VERSION}';
          "
          printf '%s\n' "$SQL" | $SSH 'docker exec -i -e MYSQL_PWD="$(grep -m1 "^DATABASE_PASSWORD=" /opt/hardwave/studio/.env.local | cut -d= -f2-)" hardwave-database mysql -u fl_organizer_user fl_organizer_db'

          echo "Database updated: wettboi -> ${VERSION_NUM}"
          rm -f ~/.ssh/deploy_key
      - name: Post Discord changelog
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BETA_WEBHOOK_URL: ${{ secrets.DISCORD_BETA_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.version }}
          PLUGIN_NAME: "Hardwave WettBoi"
        run: |
          set -eu
          # Release announcements (founder's rule, 2026-09-15): a clean tag gets its
          # version post on the changelog webhook; a release candidate (any "-"
          # suffix) notifies beta testers only, and founders are beta testers.
          # An RC never posts on the public webhook: without a beta webhook
          # secret it is skipped.
          case "$VERSION" in
            *-*)
              HOOK="${DISCORD_BETA_WEBHOOK_URL:-}"
              if [ -z "$HOOK" ]; then
                echo "Release candidate ${VERSION}: no DISCORD_BETA_WEBHOOK_URL secret, not posting"
                exit 0
              fi
              ;;
            *)
              HOOK="$DISCORD_WEBHOOK_URL"
              ;;
          esac
          git fetch --tags --force >/dev/null 2>&1 || true
          BULLETS=$(git tag -l --format='%(contents)' "$VERSION" 2>/dev/null \
            | grep '^[[:space:]]*[-*]' \
            | sed -e 's/^[[:space:]]*[-*][[:space:]]*//' \
                  -e 's/[[:space:]]*$//' \
            || true)
          if [ -z "$BULLETS" ]; then
            BULLETS="Stability and maintenance updates"
          fi

          DESC_BODY=$(printf '%s\n' "$BULLETS" \
            | sed -e '/^[[:space:]]*$/d' \
                  -e 's/[[:space:]]*\.$//' \
                  -e 's/^/- /' \
                  -e 's/$/./')

          DESCRIPTION=$(printf "**What's new**\n%s\n\nInstall or update via the **Hardwave Suite**." "$DESC_BODY")
          PUB_DATE=$(date -u +"%-d %b %Y")
          FOOTER="${PLUGIN_NAME} · published ${PUB_DATE}"
          TITLE="${PLUGIN_NAME} ${VERSION}"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg footer "$FOOTER" \
            '{
              "embeds": [{
                "title": $title,
                "description": $description,
                "color": 14427686,
                "footer": { "text": $footer }
              }]
            }')

          curl -fsS -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$HOOK" >/dev/null
          echo "Discord changelog posted for ${VERSION}"

  # ── Suite beta channel ──────────────────────────────────────────────────
  # Every tagged build is published to Suite's beta manifest, which Pro and
  # lifetime users see when they switch Suite to the Beta channel. That is how a
  # release candidate reaches its testers before a developer approves it in the
  # admin panel and it ships without the -rc suffix. The server supersedes the
  # previous build and expires it after 21 days.
  publish-beta:
    needs: [release]
    # Release candidates only. A stable tag reaches everyone through the catalogue;
    # in the beta channel it would only show up as a "beta" of the stable build.
    if: contains(github.ref_name, '-') || contains(github.event.inputs.version, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Suite beta manifest
        env:
          INTERNAL_SECRET: ${{ secrets.HW_INTERNAL_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${INTERNAL_SECRET}" ]; then
            # A finished release should not fail over this; say plainly what is missing.
            echo "::warning::HW_INTERNAL_API_SECRET is not set on this repo, so this build was NOT published to the Suite beta channel."
            exit 0
          fi
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${VERSION}"

          # One build per platform. The release job just uploaded these; fetch each to hash it.
          ARTEFACTS='[]'
          for PAIR in windows:hardwave-wettboi-windows-x64.zip macos:hardwave-wettboi-macos-universal.zip linux:hardwave-wettboi-linux-x64.zip; do
            PLATFORM="${PAIR%%:*}"
            FILE="${PAIR#*:}"
            if ! curl -sfL --retry 5 --retry-delay 10 --retry-all-errors -o "$FILE" "$BASE/$FILE"; then
              echo "::warning::$FILE is not on the release, so $PLATFORM testers get no beta build."
              continue
            fi
            ARTEFACTS=$(jq -c --arg p "$PLATFORM" --arg u "$BASE/$FILE" \
              --arg s "$(sha256sum "$FILE" | cut -d' ' -f1)" --argjson z "$(stat -c%s "$FILE")" \
              '. + [{platform:$p, url:$u, sha256:$s, size:$z}]' <<<"$ARTEFACTS")
            rm -f "$FILE"
          done
          if [ "$(jq length <<<"$ARTEFACTS")" -eq 0 ]; then
            echo "No release artefacts found to publish" >&2
            exit 1
          fi
          # The single artefact fields are for Suite 0.22.17 and older: the Windows build.
          PRIMARY=$(jq -c '(map(select(.platform == "windows")) + .)[0]' <<<"$ARTEFACTS")

          # The tag has a leading "v"; the catalogue and the Suite registry do not.
          BODY=$(jq -n --arg v "$VERSION" --argjson a "$ARTEFACTS" --argjson w "$PRIMARY" \
            '{plugin_slug:"wettboi", version:($v | ltrimstr("v")), artefacts:$a, artefact_url:$w.url, artefact_sha256:$w.sha256, artefact_size:$w.size, changelog:("See the release notes for " + $v + ".")}')
          HTTP=$(curl -s -o resp.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-internal-secret: ${INTERNAL_SECRET}" \
            -d "$BODY" \
            https://hardwavestudios.com/api/beta/publish)
          cat resp.json
          # 409 = already published (an idempotent re-run), which is fine.
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "409" ]; then
            echo "beta publish failed with HTTP $HTTP" >&2
            exit 1
          fi
