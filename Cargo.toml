[workspace]
members = ["xtask"]

[package]
name = "hardwave-wettboi"
version = "0.4.5"
edition = "2021"
license = "Proprietary"
description = "Hardwave WettBoi — sidechain reverb & delay VST3/CLAP plugin by Hardwave Studios"

[lib]
# "lib" alongside "cdylib" so the DSP can be linked by tests. The plugin bundle
# is still built from the cdylib by xtask; this adds a target, it changes none.
crate-type = ["cdylib", "lib"]

[features]
default = ["gui"]
gui = ["dep:wry"]

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
# ── nih-plug (VST3 / CLAP framework) ─────────────────────────────────────────
nih_plug = { git = "https://github.com/Dishairano/nih-plug-hardwave.git", branch = "main" }

# ── The raw CLAP ABI ─────────────────────────────────────────────────────────
# src/clap_export.rs exports the CLAP entry point itself so it can check a saved
# state's length before the framework allocates for it. Pinned to the revision
# nih-plug already builds, so this adds a name to the build and not a crate.
clap-sys = { git = "https://github.com/micahrj/clap-sys.git", rev = "25d7f53fdb6363ad63fbd80049cb7a42a97ac156" }

# ── GUI: wry WebView ─────────────────────────────────────────────────────────
wry = { version = "0.46", optional = true }

# ── Serialisation ─────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Concurrency & atomics ────────────────────────────────────────────────────
crossbeam-channel = "0.5"
parking_lot = "0.12"

# ── Auth token storage ───────────────────────────────────────────────────────
dirs = "5"

# ── raw-window-handle bridge ─────────────────────────────────────────────────
raw-window-handle = "0.6"

# ── Linux GTK ────────────────────────────────────────────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
# The editor pump must run on the main queue: WKWebView may only be touched
# from the main thread, and a worker thread cannot do it.
dispatch = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
